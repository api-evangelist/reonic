name: Reonic
description: >-
  Reonic is a German climate-tech company (founded 2021, Augsburg) building an AI-powered operating
  system for renewable-energy installers. Its platform covers the full workflow for selling and
  installing photovoltaic systems, heat pumps, EV chargers, and battery storage — CRM and lead
  management, 3D roof planning and shading simulation, instant pricing, proposal generation with
  digital signature, project and installation tracking, and documentation. The Reonic REST API v3
  exposes 111 endpoints across 33 resource areas (contacts, residential and commercial projects,
  tasks, files, components, planning templates, time tracking, wiki, photogrammetry, and more),
  authenticated with rnc_v3_ API keys, plus a 17-event signed webhook surface.
