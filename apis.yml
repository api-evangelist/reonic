- aid: reonic:reonic-upload-api
  name: Reonic Upload API
  description: >-
    Two-step uploads for endpoints that accept user-provided file content.


    Call `POST /uploads/create` to obtain an `uploadUrl` and an `uploadId`. `PUT` the raw file body to
    `uploadUrl` within 1 hour, with a `Content-Type` header matching the file — not `multipart/form-data`.
    Then reference the `uploadId` from a registration endpoint such as those in [**Files**](#tag/files)
    or [**Photogrammetry**](#tag/photogrammetry) to attach the file to a resource.


    Prefer this flow over a registration endpoint's `url` shortcut when the file isn't already hosted
    at a public URL, or when you'd rather not expose it on the internet.
  humanURL: https://api.reonic.de/rest/v3/docs
  baseURL: https://api.reonic.de/rest/v3/
  tags:
