openapi: 3.2.0
info:
  title: Reonic REST Api v3 Kanban Columns API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Kanban Columns
  description: Kanban columns projects move through on a **Kanban Boards**.
paths:
  /kanbanColumns:
    get:
      summary: List Kanban columns
      description: 'List all Kanban columns.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Kanban Columns
      parameters:
      - schema:
          type: string
          format: uuid
          description: Filter by the board a column belongs to. Reference to [**Kanban Boards**](#tag/kanban-boards)
        required: false
        description: Filter by the board a column belongs to. Reference to [**Kanban Boards**](#tag/kanban-boards)
        name: boardId
        in: query
      - schema:
          type: string
          enum:
          - exclude
          - include
          - only
          default: exclude
          description: 'Controls whether archived columns appear in results. Default: exclude.'
        required: false
        description: 'Controls whether archived columns appear in results. Default: exclude.'
        name: archived
        in: query
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: List of all Kanban columns
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/KanbanColumn'
                    description: List of items
                required:
                - data
      operationId: getKanbanColumns
      x-operation-id-source: derived
  /kanbanColumns/{columnId}:
    get:
      summary: Get Kanban column
      description: 'Get a single Kanban column by its ID.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Kanban Columns
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: columnId
        in: path
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: The Kanban column
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanbanColumn'
        '404':
          description: Kanban column not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                additionalProperties: false
      operationId: getKanbanColumnsByColumnId
      x-operation-id-source: derived
components:
  schemas:
    KanbanColumn:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
        boardId:
          type: string
          format: uuid
          description: Reference to [**Kanban Boards**](#tag/kanban-boards)
        position:
          type: integer
          minimum: 0
          description: Order within the board, ascending from left to right.
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
      required:
      - id
      - name
      - boardId
      - position
      - archivedAt
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
