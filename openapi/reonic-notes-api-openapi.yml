openapi: 3.2.0
info:
  title: Reonic REST Api v3 Notes API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Notes
  description: Free-text notes attached to a project or contact.
paths:
  /notes:
    get:
      summary: List notes
      description: 'List notes for an entity in a paginated format.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Notes
      parameters:
      - schema:
          type: string
          enum:
          - contact
          - residentialProject
          - commercialProject
          - checklistItem
          - task
          - photogrammetryJob
          description: The type of the parent entity.
          example: contact
        required: false
        description: The type of the parent entity.
        name: parentType
        in: query
      - schema:
          type: string
          format: uuid
          description: Filter by the ID of the parent the notes are attached to.
          example: 123e4567-e89b-12d3-a456-426614174000
        required: false
        description: Filter by the ID of the parent the notes are attached to.
        name: parentId
        in: query
      - schema:
          type: string
          format: uuid
          description: Filter by the ID of the user who created the notes. References [**Users**](#tag/users)
          example: 123e4567-e89b-12d3-a456-426614174000
        required: false
        description: Filter by the ID of the user who created the notes. References [**Users**](#tag/users)
        name: createdById
        in: query
      - schema:
          type:
          - string
          - 'null'
          default: -createdAt
          description: 'Sort order. Use field names for ascending (e.g. "createdAt"), minus sign for descending (e.g. "-createdAt"). Chain with commas (e.g. "createdAt,editedAt"). Sortable fields: createdAt, createdById, editedAt. Defaults to -createdAt.'
          examples:
          - createdAt
          - -createdAt
        required: false
        description: 'Sort order. Use field names for ascending (e.g. "createdAt"), minus sign for descending (e.g. "-createdAt"). Chain with commas (e.g. "createdAt,editedAt"). Sortable fields: createdAt, createdById, editedAt. Defaults to -createdAt.'
        name: sort
        in: query
      - schema:
          type: integer
          minimum: 1
          default: 1
          description: 'Page number, starting from 1. Default: 1.'
        required: false
        description: 'Page number, starting from 1. Default: 1.'
        name: page
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: 'Number of items per page. Default: 50. Max: 200.'
        required: false
        description: 'Number of items per page. Default: 50. Max: 200.'
        name: itemsPerPage
        in: query
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: Paginated list of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        minimum: 1
                        description: Current page number
                      perPage:
                        type: integer
                        minimum: 1
                        description: Number of items per page
                      total:
                        type: integer
                        minimum: 0
                        description: Total number of items across all pages
                      totalPages:
                        type: integer
                        minimum: 1
                      next:
                        type:
                        - string
                        - 'null'
                        description: Path to the next page, or null if there is no next page
                      prev:
                        type:
                        - string
                        - 'null'
                        description: Path to the previous page, or null if there is no previous page
                    required:
                    - page
                    - perPage
                    - total
                    - totalPages
                    - next
                    - prev
                required:
                - data
                - pagination
      operationId: getNotes
      x-operation-id-source: derived
  /notes/create:
    post:
      description: 'Create a note and attach it to an entity (i.e. contact, task or residentialProject).


        **Allowed API keys:** Read and Write, Lead creation only'
      summary: Create note
      tags:
      - Notes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      example: 123e4567-e89b-12d3-a456-426614174000
                    type:
                      type: string
                      enum:
                      - contact
                      - residentialProject
                      - commercialProject
                      - checklistItem
                      - task
                      - photogrammetryJob
                  required:
                  - id
                  - type
                text:
                  type: string
                  minLength: 1
                  maxLength: 10000
                  description: Supports markdown formatting
                  example: '**Lorem Ipsum**'
                pinned:
                  type: boolean
                  default: false
              required:
              - parent
              - text
              additionalProperties: false
      responses:
        '201':
          description: The created note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
      operationId: postNotesCreate
      x-operation-id-source: derived
  /notes/{noteId}/update:
    post:
      summary: Update note
      description: 'Pin or unpin a note.


        **Allowed API keys:** Read and Write'
      tags:
      - Notes
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: noteId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned:
                  type: boolean
                  description: '`true` to pin the note, `false` to unpin.'
              required:
              - pinned
              additionalProperties: false
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Note'
                required:
                - data
      operationId: postNotesByNoteIdUpdate
      x-operation-id-source: derived
components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        parent:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 123e4567-e89b-12d3-a456-426614174000
            type:
              type: string
              enum:
              - contact
              - residentialProject
              - commercialProject
              - checklistItem
              - task
              - photogrammetryJob
              description: The type of the parent entity.
              example: contact
          required:
          - id
          - type
        text:
          type: object
          properties:
            plain:
              type: string
              description: Plaintext version of the notes text content
              example: Lorem Ipsum
            markdown:
              type: string
              description: Markdown version of the notes text content
              example: '<!-- MDCV_2 -->

                **Lorem ipsum**'
          required:
          - plain
          - markdown
        createdAt:
          type: string
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
        createdById:
          type:
          - string
          - 'null'
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        editedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
        editedById:
          type:
          - string
          - 'null'
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        pinnedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
        pinnedById:
          type:
          - string
          - 'null'
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
      - id
      - parent
      - text
      - createdAt
      - createdById
      - editedAt
      - editedById
      - pinnedAt
      - pinnedById
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
