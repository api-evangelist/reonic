openapi: 3.2.0
info:
  title: Reonic REST Api v3 Calendars API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Calendars
  description: Reonic-hosted calendars only. External calendar integrations (Google, Microsoft) are visible inside the Reonic Portal but are not exposed through the public API.
paths:
  /calendars:
    get:
      summary: List calendars
      description: 'List all Reonic Calendars.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Calendars
      parameters:
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: List of all Reonic Calendars
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        name:
                          type: string
                        color:
                          type:
                          - string
                          - 'null'
                          description: Hex code
                          example: '#000000'
                        categoryId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        userId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        teamId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                        type:
                          type: string
                          enum:
                          - Team
                          - Tenancy
                          - User
                          - Client
                        active:
                          type: boolean
                      required:
                      - id
                      - name
                      - color
                      - categoryId
                      - userId
                      - teamId
                      - type
                      - active
                    description: List of items
                required:
                - data
      operationId: getCalendars
      x-operation-id-source: derived
components:
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
