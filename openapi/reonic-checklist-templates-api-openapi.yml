openapi: 3.2.0
info:
  title: Reonic REST Api v3 Checklist Templates API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Checklist Templates
  description: 'Reusable checklists. Apply one to a residential project to populate its **Checklists**.


    > [!warning]

    > **Beta:** These endpoints are in beta and may change as the service evolves. Please report issues or unexpected behavior to our team.'
  x-displayName: Checklist Templates (BETA)
paths:
  /checklistTemplates:
    get:
      summary: List checklist templates
      description: 'List checklist templates (planning templates). A checklist template is a reusable bundle of line items that can be applied to a residential or commercial offer at a given stage. Distinct from `/checklists/{projectId}`, which returns the per-project checklist state.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Checklist Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: array
          items:
            type: string
            enum:
            - all
            - residential
            - residentialSolar
            - residentialEvCharger
            - residentialBatteryStorage
            - residentialHotWaterStorage
            - residentialHeatingStorage
            - residentialHeating
            - residentialHeatPump
            - residentialAccessoryToHeatPump
            - residentialOptionalComponents
            - residentialAdditionalComponents
            - commercial
            - commercialSolar
            - commercialBatteryStorage
            - commercialLandlordToTenant
            - commercialPowerPurchaseAgreement
            - commercialAdditionalComponents
          description: 'Comma-separated list or repeated query param. Allowed values: all, residential, residentialSolar, residentialEvCharger, residentialBatteryStorage, residentialHotWaterStorage, residentialHeatingStorage, residentialHeating, residentialHeatPump, residentialAccessoryToHeatPump, residentialOptionalComponents, residentialAdditionalComponents, commercial, commercialSolar, commercialBatteryStorage, commercialLandlordToTenant, commercialPowerPurchaseAgreement, commercialAdditionalComponents.'
        required: false
        description: 'Comma-separated list or repeated query param. Allowed values: all, residential, residentialSolar, residentialEvCharger, residentialBatteryStorage, residentialHotWaterStorage, residentialHeatingStorage, residentialHeating, residentialHeatPump, residentialAccessoryToHeatPump, residentialOptionalComponents, residentialAdditionalComponents, commercial, commercialSolar, commercialBatteryStorage, commercialLandlordToTenant, commercialPowerPurchaseAgreement, commercialAdditionalComponents.'
        style: form
        explode: false
        name: target
        in: query
      - schema:
          type:
          - boolean
          - 'null'
        required: false
        name: active
        in: query
      - schema:
          type:
          - boolean
          - 'null'
        required: false
        name: includeAny
        in: query
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: Array of checklist templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChecklistTemplate'
                    description: List of items
                required:
                - data
      operationId: getChecklistTemplates
      x-operation-id-source: derived
  /checklistTemplates/{checklistId}:
    get:
      summary: Get checklist template
      description: 'Get a single checklist template by its ID.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Checklist Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: checklistId
        in: path
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: The checklist template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplate'
      operationId: getChecklistTemplatesByChecklistId
      x-operation-id-source: derived
  /checklistTemplates/create:
    post:
      summary: Create checklist template
      description: 'Create a new checklist template. The template is created with a default name, no items, and no targets; use `POST /checklistTemplates/{id}/update` to populate it.


        **Allowed API keys:** Read and Write'
      tags:
      - Checklist Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '201':
          description: The newly created checklist template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplate'
      operationId: postChecklistTemplatesCreate
      x-operation-id-source: derived
  /checklistTemplates/{checklistId}/update:
    post:
      summary: Update checklist template
      description: 'Update an existing checklist template''s metadata. The `targets` array must always be supplied — passing an empty array clears the targeting. Item editing is not currently exposed on V3.


        **Allowed API keys:** Read and Write'
      tags:
      - Checklist Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: checklistId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                active:
                  type: boolean
                targets:
                  type: array
                  items:
                    type: string
                    enum:
                    - all
                    - residential
                    - residentialSolar
                    - residentialEvCharger
                    - residentialBatteryStorage
                    - residentialHotWaterStorage
                    - residentialHeatingStorage
                    - residentialHeating
                    - residentialHeatPump
                    - residentialAccessoryToHeatPump
                    - residentialOptionalComponents
                    - residentialAdditionalComponents
                    - commercial
                    - commercialSolar
                    - commercialBatteryStorage
                    - commercialLandlordToTenant
                    - commercialPowerPurchaseAgreement
                    - commercialAdditionalComponents
              required:
              - targets
              additionalProperties: false
      responses:
        '200':
          description: The updated checklist template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ChecklistTemplate'
                required:
                - data
      operationId: postChecklistTemplatesByChecklistIdUpdate
      x-operation-id-source: derived
  /checklistTemplates/{checklistId}/delete:
    post:
      summary: Delete checklist template
      description: 'Delete a checklist template by its ID.


        **Allowed API keys:** Read and Write'
      tags:
      - Checklist Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: checklistId
        in: path
      responses:
        '200':
          description: The deleted checklist template ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174000
                    required:
                    - id
                required:
                - data
      operationId: postChecklistTemplatesByChecklistIdDelete
      x-operation-id-source: derived
components:
  schemas:
    ChecklistTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        active:
          type: boolean
        position:
          type: number
        targets:
          type: array
          items:
            type: string
            enum:
            - all
            - residential
            - residentialSolar
            - residentialEvCharger
            - residentialBatteryStorage
            - residentialHotWaterStorage
            - residentialHeatingStorage
            - residentialHeating
            - residentialHeatPump
            - residentialAccessoryToHeatPump
            - residentialOptionalComponents
            - residentialAdditionalComponents
            - commercial
            - commercialSolar
            - commercialBatteryStorage
            - commercialLandlordToTenant
            - commercialPowerPurchaseAgreement
            - commercialAdditionalComponents
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              componentId:
                type: string
                format: uuid
              quantity:
                type: number
              position:
                type: number
              visibleToCustomer:
                type: boolean
              priceOverridesComponent:
                type: boolean
            required:
            - id
            - componentId
            - quantity
            - position
            - visibleToCustomer
            - priceOverridesComponent
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
        createdById:
          type:
          - string
          - 'null'
          format: uuid
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
        updatedById:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - name
      - description
      - active
      - position
      - targets
      - items
      - createdAt
      - createdById
      - updatedAt
      - updatedById
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
