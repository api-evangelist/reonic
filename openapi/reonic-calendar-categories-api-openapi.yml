openapi: 3.2.0
info:
  title: Reonic REST Api v3 Calendar Categories API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Calendar Categories
  description: Groupings used to organize **Calendars**.
paths:
  /calendarCategories:
    get:
      summary: List calendar categories
      description: 'List all calendar categories


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Calendar Categories
      parameters:
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: List of all calendar categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                          example: 123e4567-e89b-12d3-a456-426614174000
                        name:
                          type: string
                        order:
                          type: integer
                          description: Sort order within the list of categories. Lower values come first.
                      required:
                      - id
                      - name
                      - order
                    description: List of items
                required:
                - data
      operationId: getCalendarCategories
      x-operation-id-source: derived
components:
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
