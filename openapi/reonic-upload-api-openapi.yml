openapi: 3.2.0
info:
  title: Reonic REST Api v3 Upload API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Upload
  description: Two-step uploads for endpoints that accept user-provided file content.
paths:
  /uploads/create:
    post:
      summary: Create upload URL
      description: 'Returns an `uploadUrl` plus an `uploadId` you can later pass to a registration endpoint.


        Upload your file with a single `PUT` request to `uploadUrl`, sending the raw file bytes as the request body and a `Content-Type` header that matches the file. Do not use `multipart/form-data`. The URL stops accepting uploads after `expiresAt` (1 hour after creation).


        Once the upload completes, reference `uploadId` from a registration endpoint — for example `POST /files/create`.


        **Allowed API keys:** Read and Write'
      tags:
      - Upload
      responses:
        '201':
          description: Upload URL and identifier
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId:
                    type: string
                    description: Opaque identifier for the staged upload. Pass it unchanged to a registration endpoint after `PUT`-ing the file to `uploadUrl`.
                    example: 123e4567-e89b-12d3-a456-426614174000/123e4567-e89b-12d3-a456-426614174002
                  uploadUrl:
                    type: string
                    description: '`PUT` the raw file bytes here with a `Content-Type` header matching the file. Valid until `expiresAt`.'
                    example: https://reonic.s3.eu-central-1.amazonaws.com/...
                  expiresAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp at which `uploadUrl` stops accepting uploads.
                    example: '2026-01-01T15:30:00.000Z'
                required:
                - uploadId
                - uploadUrl
                - expiresAt
      operationId: postUploadsCreate
      x-operation-id-source: derived
components:
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
