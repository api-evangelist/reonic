openapi: 3.2.0
info:
  title: Reonic REST Api v3 Offer Templates API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Offer Templates
  description: 'Pre-configured combinations of planning packages used to quickly populate package categories when creating an offer.


    > [!warning]

    > **Beta:** These endpoints are in beta and may change as the service evolves. Please report issues or unexpected behavior to our team.'
  x-displayName: Offer Templates (BETA)
paths:
  /offerTemplates:
    get:
      summary: List offer templates
      description: 'List offer templates. An offer template is a pre-configured combination of planning packages used to quickly populate package categories when creating an offer.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Offer Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: Array of offer templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferTemplate'
                    description: List of items
                required:
                - data
      operationId: getOfferTemplates
      x-operation-id-source: derived
  /offerTemplates/{offerTemplateId}:
    get:
      summary: Get offer template
      description: 'Get a single offer template by its ID.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Offer Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: offerTemplateId
        in: path
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: The offer template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferTemplate'
      operationId: getOfferTemplatesByOfferTemplateId
      x-operation-id-source: derived
  /offerTemplates/create:
    post:
      summary: Create offer template
      description: 'Create a new offer template. The template is created with a default name and no planning package references; use `POST /offerTemplates/{id}/update` to configure its package categories.


        **Allowed API keys:** Read and Write'
      tags:
      - Offer Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '201':
          description: The newly created offer template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferTemplate'
      operationId: postOfferTemplatesCreate
      x-operation-id-source: derived
  /offerTemplates/{offerTemplateId}/update:
    post:
      summary: Update offer template
      description: 'Update an existing offer template.


        **Allowed API keys:** Read and Write'
      tags:
      - Offer Templates
      x-badges:
      - name: BETA
        position: before
        color: '#ea580c'
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: offerTemplateId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 2000
                active:
                  type: boolean
                targets:
                  type: array
                  items:
                    type: string
                    enum:
                    - residential
                    - commercial
                solarPackageId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                batteryStoragePackageId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                evChargerPackageId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                heatPumpPackageId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                optionalPackageId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                additionalPackageId:
                  type:
                  - string
                  - 'null'
                  format: uuid
              additionalProperties: false
      responses:
        '200':
          description: The updated offer template
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/OfferTemplate'
                required:
                - data
      operationId: postOfferTemplatesByOfferTemplateIdUpdate
      x-operation-id-source: derived
  /offerTemplates/{offerTemplateId}/delete:
    post:
      summary: Delete offer template
      description: 'Delete an offer template by its ID.


        **Allowed API keys:** Read and Write'
      tags:
      - Offer Templates
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: offerTemplateId
        in: path
      responses:
        '200':
          description: The deleted offer template ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 123e4567-e89b-12d3-a456-426614174000
                    required:
                    - id
                required:
                - data
      operationId: postOfferTemplatesByOfferTemplateIdDelete
      x-operation-id-source: derived
components:
  schemas:
    OfferTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
        description:
          type: string
        position:
          type: number
        active:
          type: boolean
        targets:
          type: array
          items:
            type: string
            enum:
            - residential
            - commercial
        solarPackageId:
          type:
          - string
          - 'null'
          format: uuid
        batteryStoragePackageId:
          type:
          - string
          - 'null'
          format: uuid
        evChargerPackageId:
          type:
          - string
          - 'null'
          format: uuid
        heatPumpPackageId:
          type:
          - string
          - 'null'
          format: uuid
        optionalPackageId:
          type:
          - string
          - 'null'
          format: uuid
        additionalPackageId:
          type:
          - string
          - 'null'
          format: uuid
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-01-01T15:30:00.000Z'
      required:
      - id
      - name
      - description
      - position
      - active
      - targets
      - solarPackageId
      - batteryStoragePackageId
      - evChargerPackageId
      - heatPumpPackageId
      - optionalPackageId
      - additionalPackageId
      - updatedAt
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
