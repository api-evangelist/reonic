openapi: 3.2.0
info:
  title: Reonic REST Api v3 Tags API
  description: The Reonic REST API v3 provides programmatic access to create and manage resources.
  version: 3.2.0
  contact:
    email: kontakt@reonic.de
    url: https://reonic.com
    name: Reonic GmbH
servers:
- url: '{apiBaseUrl}/rest/v3/'
security:
- X-Authorization: []
tags:
- name: Tags
  description: Reusable labels for categorizing and filtering projects, contacts, and other entities.
paths:
  /tags:
    get:
      summary: List tags
      description: 'List all tags.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Tags
      parameters:
      - schema:
          type: string
          enum:
          - residentialProject
          - commercialProject
          description: Type of entity the tag can be applied to.
          example: residentialProject
        required: false
        description: Type of entity the tag can be applied to.
        name: parentType
        in: query
      - schema:
          type: string
          enum:
          - exclude
          - include
          - only
          default: exclude
          description: 'Controls whether archived tags appear in results. Default: exclude.'
        required: false
        description: 'Controls whether archived tags appear in results. Default: exclude.'
        name: archived
        in: query
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: List of all tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
                    description: List of items
                required:
                - data
      operationId: getTags
      x-operation-id-source: derived
  /tags/{tagId}:
    get:
      summary: Get tag
      description: 'Get a single tag by its ID.


        **Allowed API keys:** Read-only, Read and Write'
      tags:
      - Tags
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: tagId
        in: path
      - schema:
          type: string
          example: no-cache
        required: false
        name: Reonic-Cache-Control
        in: header
        description: Set to 'no-cache' to bypass the 1-hour response cache and force a fresh read. The fresh response is then written back to the cache for subsequent callers. Forced refreshes count against the uncached rate-limit bucket (30/min); only cache hits count against the cached bucket (500/min).
      responses:
        '200':
          description: Tag details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '404':
          description: Tag not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Not found
                required:
                - message
      operationId: getTagsByTagId
      x-operation-id-source: derived
  /tags/create:
    post:
      summary: Create tag
      description: 'Create a new tag


        **Allowed API keys:** Read and Write'
      tags:
      - Tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 500
                parentType:
                  type: string
                  enum:
                  - residentialProject
                  - commercialProject
                  description: Type of entity the tag can be applied to.
                  example: residentialProject
                textColor:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex code of the tag's text color
                  example: '#000000'
                backgroundColor:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex code of the tag's background color
                  example: '#00FF00'
              required:
              - label
              - parentType
              - textColor
              - backgroundColor
              additionalProperties: false
      responses:
        '201':
          description: The created tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
      operationId: postTagsCreate
      x-operation-id-source: derived
  /tags/{tagId}/update:
    post:
      summary: Update tag
      description: 'Update a tag by its ID.


        **Allowed API keys:** Read and Write'
      tags:
      - Tags
      parameters:
      - schema:
          type: string
          format: uuid
        required: true
        name: tagId
        in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 500
                textColor:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex code of the tag's text color
                  example: '#000000'
                backgroundColor:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                  description: Hex code of the tag's background color
                  example: '#00FF00'
                archived:
                  type: boolean
                  description: '`true` to archive the tag, `false` to unarchive.'
              additionalProperties: false
      responses:
        '200':
          description: Updated tag
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Tag'
                required:
                - data
      operationId: postTagsByTagIdUpdate
      x-operation-id-source: derived
components:
  schemas:
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        label:
          type: string
        parentType:
          type: string
          enum:
          - residentialProject
          - commercialProject
          description: Type of entity the tag can be applied to.
          example: residentialProject
        textColor:
          type: string
          description: Hex code of the tag's text color
          example: '#000000'
        backgroundColor:
          type: string
          description: Hex code of the tag's background color
          example: '#00FF00'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Last edited date
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - label
      - parentType
      - textColor
      - backgroundColor
      - createdAt
      - updatedAt
      - archivedAt
  securitySchemes:
    X-Authorization:
      type: apiKey
      in: header
      name: X-Authorization
