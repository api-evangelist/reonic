    VariantOptionalBundle:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        selected:
