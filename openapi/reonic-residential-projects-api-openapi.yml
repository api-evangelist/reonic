      - customerNumber
      - customerMessage
      - keyAccountManagerId
      - kanbanBoardId
      - kanbanColumnId
      - leadSourceId
      - tagIds
      - deal
      - primaryOfferVariant
      - projectCreatedAt
      - requestCreatedAt
      - offerCreatedAt
      - installationCreatedAt
      - archivedAt
      - updatedAt
