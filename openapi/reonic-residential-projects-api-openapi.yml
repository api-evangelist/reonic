              type:
              - string
              - 'null'
              maxLength: 1000
            photovateId:
              type:
              - string
              - 'null'
              maxLength: 1000
            pipedriveId:
              type:
              - integer
              - 'null'
              minimum: 1
              maximum: 9007199254740991
            weclappId:
              type:
              - string
              - 'null'
