          closedAt:
            type:
            - string
            - 'null'
            format: date-time
            description: 'Effective close date of the deal: the manually set close date if present, otherwise the date of the latest valid signature, otherwise `deal.decidedAt` once the deal is Won. `null` while the deal is undecided.'
          subsidies:
            type: object
            properties:
              de:
                type: object
                properties:
                  bafaApplicationId:
                    type:
                    - string
                    - 'null'
                    description: BAFA confirmation-of-application ID (Bestätigung zum Antrag, BzA).
                  bafaCompletionId:
                    type:
                    - string
                    - 'null'
                    description: BAFA confirmation-after-completion ID (Bestätigung nach Durchführung, BnD).
                required:
                - bafaApplicationId
                - bafaCompletionId
                description: German (BAFA/KfW) subsidy identifiers.
            description: Country-scoped subsidy identifiers issued by national agencies.
          variantIds:
            type: array
            items:
              type: string
              format: uuid
          signatureRequests:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: 123e4567-e89b-12d3-a456-426614174000
                status:
                  type: string
                  enum:
                  - Expired
                  - RequestedAndAllowed
                  - Signed
                  - Withdrawn
                  - WithdrawnByCustomer
                variantIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: The variants this signature request was sent for.
                signatureOptions:
                  type: array
                  items:
                    type: object
                    properties:
                      variantId:
                        type: string
                        format: uuid
                        description: The offer variant this signature option belongs to.
                        example: 123e4567-e89b-12d3-a456-426614174000
                      paymentOptionId:
                        type:
                        - string
                        - 'null'
                        format: uuid
                        description: The payment option this signature option belongs to. `null` for legacy/default-payment documents.
                        example: 123e4567-e89b-12d3-a456-426614174000
                    required:
                    - variantId
                    - paymentOptionId
                  description: The variant/payment option combinations this signature request was sent for.
                signedVariantId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: The variant the customer signed; null until signed.
                signedPaymentOptionId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: The payment option the customer signed; null until signed or for legacy/default-payment documents.
                  example: 123e4567-e89b-12d3-a456-426614174000
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                withdrawnAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                signedAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                signedPdfUrl:
                  type:
                  - string
                  - 'null'
                  format: uri
                  description: Only set once the document is signed.
              required:
              - id
              - status
              - variantIds
              - signatureOptions
              - signedVariantId
              - signedPaymentOptionId
              - createdAt
              - expiresAt
              - withdrawnAt
              - signedAt
              - signedPdfUrl
          customerPortalUrl:
            type: string
            format: uri
            description: URL to the customer-facing portal page for this project. The URL is assembled from the project id and is not validated — following it for an archived or invalid project will 404.
          integrations:
            type: object
            properties:
              hubspotDealId:
                type:
                - string
                - 'null'
              pipedriveDealId:
                type:
                - integer
                - 'null'
              weclappOpportunityId:
                type:
                - string
                - 'null'
              bitrixDealId:
                type:
                - string
                - 'null'
              photovateDealId:
                type:
                - string
                - 'null'
            required:
            - hubspotDealId
            - pipedriveDealId
            - weclappOpportunityId
            - bitrixDealId
            - photovateDealId
            description: IDs of this project in third-party systems.
