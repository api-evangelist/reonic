          type: object
          properties:
            state:
              type:
              - string
              - 'null'
              enum:
              - Open
              - Won
              - Lost
              - null
              description: Only set once project has moved to offer stage.
            decidedAt:
              type:
              - string
              - 'null'
              format: date-time
            lostReason:
              type:
              - string
              - 'null'
              enum:
              - notInterested
              - purchasedFromCompetitor
              - budgetConstraints
              - noResponseFromLead
              - leadIsNotQualified
              - changedDecision
              - projectPostponed
              - wentWithAnotherSolution
              - featuresNotMatchingRequirements
              - timingIssues
              - lackOfResources
              - highPricing
              - poorFitForOurServices
              - unsatisfactoryProductDemo
              - leadLostContact
              - internalDecisionToPausePurchase
              - movedForwardWithInHouseSolution
              - lackOfTrustInTheBrand
              - dissatisfiedWithCustomerService
              - productLimitations
              - marketConditions
              - preferredAnotherVendor
              - technicalIssues
              - leadHadIncorrectInformation
              - legalOrRegulatoryIssues
              - null
            notes:
              type:
              - string
              - 'null'
          required:
          - state
          - decidedAt
          - lostReason
          - notes
          description: Deal information, only relevant for projects in offer stage or later
        primaryOfferVariant:
          type: object
          properties:
            id:
              type: string
              format: uuid
              example: 123e4567-e89b-12d3-a456-426614174000
            componentsTotalPrice:
              type: number
              description: Sum of the planned prices of all components in this variant (with VAT).
            totalPriceOverride:
              type:
              - number
              - 'null'
              description: Manual override for the variant's total price. When set, takes precedence over componentsTotalPrice.
          required:
          - id
          - componentsTotalPrice
          - totalPriceOverride
        projectCreatedAt:
          type: string
          format: date-time
        requestCreatedAt:
          type:
          - string
          - 'null'
          format: date-time
        offerCreatedAt:
          type:
          - string
          - 'null'
          format: date-time
        installationCreatedAt:
          type:
          - string
          - 'null'
          format: date-time
        archivedAt:
          type:
          - string
          - 'null'
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of the most recent modification to this project.
