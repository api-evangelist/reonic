          description: Whether the customer has opted into this bundle. Only selected bundles count toward the variant total.
        price:
          $ref: '#/components/schemas/Price'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/VariantLineItem'
      required:
      - id
      - name
      - description
      - selected
      - price
      - lineItems
    VariantSystem:
      type:
      - object
      - 'null'
      properties:
        price:
          allOf:
          - $ref: '#/components/schemas/Price'
          - description: Price subtotal for this system, after any system-level rebates.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/VariantLineItem'
      required:
      - price
      - lineItems
    ResidentialVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: The variant's display name.
        isPrimary:
          type: boolean
          description: Whether this is the project's primary offer variant.
        totalPrice:
          $ref: '#/components/schemas/Price'
        totalPriceOverride:
          type:
          - number
          - 'null'
          minimum: 0
          description: 'Manually agreed net total (excludes VAT), or `null` if unset. When present it supersedes `totalPrice`: `totalPrice` still reports the summed systems and selected bundles and will not equal this value, so treat this — not `totalPrice` — as the variant''s effective total whenever it is set.'
        systems:
          type: object
          properties:
            solar:
              $ref: '#/components/schemas/VariantSystem'
            batteryStorage:
              $ref: '#/components/schemas/VariantSystem'
            heating:
              $ref: '#/components/schemas/VariantSystem'
            evCharger:
              $ref: '#/components/schemas/VariantSystem'
            additional:
              $ref: '#/components/schemas/VariantSystem'
          required:
          - solar
          - batteryStorage
          - heating
          - evCharger
          - additional
          description: Planned line items grouped by subsystem. A system is `null` when it has no line items.
        optionalBundles:
          type: array
          items:
            $ref: '#/components/schemas/VariantOptionalBundle'
          description: Opt-in component bundles offered for this variant.
      required:
      - id
      - name
      - isPrimary
      - totalPrice
      - totalPriceOverride
      - systems
      - optionalBundles
    DealSetWon:
      type: object
      properties:
        state:
          type: string
          enum:
          - Won
        notes:
          type:
          - string
          - 'null'
          maxLength: 5000
      required:
      - state
      additionalProperties: false
    ResidentialProjectDetail:
      allOf:
      - $ref: '#/components/schemas/ResidentialProject'
      - type: object
        properties:
          customerContact:
            type: object
            properties:
              id:
