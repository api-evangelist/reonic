          description: The project's installation site address. Reverse-geocoded from `latLng` and refreshed whenever `latLng` changes. This is stored independently from the customer contact's address (`customerContact.address` on create) — the two may diverge when the customer's residence differs from the installation site.
        customerContact:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: Reference to [**Contacts**](#tag/contacts)
              example: 123e4567-e89b-12d3-a456-426614174000
            fullName:
              type: string
              description: First and last name combined
            firstName:
              type: string
            lastName:
              type: string
            primaryEmail:
              type:
              - string
              - 'null'
          required:
          - id
          - fullName
          - firstName
          - lastName
          - primaryEmail
