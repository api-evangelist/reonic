            - heating
            - batteryStorage
            - evCharger
            - ev
            description: Information about existing systems provided by the customer during request stage.
          building:
            type: object
            properties:
              builtYear:
                type:
                - number
                - 'null'
              livingArea:
                type:
                - number
                - 'null'
                description: 'Unit: m²'
              numberOfInhabitants:
                type:
                - number
                - 'null'
              heatDeliveryType:
                type:
                - string
                - 'null'
                enum:
                - Floor
                - Radiators
                - FloorAndRadiators
                - null
            required:
            - builtYear
            - livingArea
            - numberOfInhabitants
            - heatDeliveryType
            description: Based on selected heat load calculation mode.
          heatLoad:
            type: object
            properties:
              mode:
                type:
                - string
                - 'null'
                enum:
                - consumption
                - properties
                - roomwise
                - null
                description: 'How the heat load was calculated. `consumption`: derived from the building''s historical energy consumption. `properties`: derived from building properties such as construction year, living area and insulation. `roomwise`: full room-wise calculation based on the building''s floor plan.'
              manualOverride:
                type:
                - number
                - 'null'
